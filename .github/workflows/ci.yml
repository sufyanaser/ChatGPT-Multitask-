name: CI - Multi-Platform Build & Verification

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  validate-and-build-windows:
    name: Windows x64 Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run unit & smoke tests
        run: npm test

      - name: Build and package Windows installer
        run: npm run pack:win

      - name: Compute SHA-256 Checksum
        shell: pwsh
        run: |
          $installer = Get-Item "release\ChatGPT-Multitask-Windows-x64-Setup.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          Write-Host "Installer SHA-256: $hash"
          "$hash  $($installer.Name)" | Out-File -Encoding utf8 "release\SHA256SUMS-win.txt"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Multitask-Windows-x64
          path: |
            release/ChatGPT-Multitask-Windows-x64-Setup.exe
            release/ChatGPT-Multitask-Windows-x64-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-win.txt

  validate-and-build-macos:
    name: macOS arm64 Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build and package macOS distribution
        run: npm run pack:mac

      - name: Compute SHA-256 Checksum
        shell: bash
        run: |
          cd release
          shasum -a 256 ChatGPT-Multitask-macOS-arm64.* > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Multitask-macOS-arm64
          path: |
            release/ChatGPT-Multitask-macOS-arm64.dmg
            release/ChatGPT-Multitask-macOS-arm64.zip
            release/latest-mac.yml
            release/SHA256SUMS-mac.txt
