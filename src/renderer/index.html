<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Multitask</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="tab-bar-container" class="tab-bar-container">
    <!-- Window drag handle / macOS traffic light spacer -->
    <div id="traffic-light-spacer" class="traffic-light-spacer"></div>

    <!-- Navigation buttons (Back, Forward, Reload) -->
    <div class="nav-controls">
      <button id="btn-back" class="nav-btn" title="Back (Cmd+[ / Alt+Left)" disabled>
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="10 3 5 8 10 13"></polyline>
        </svg>
      </button>
      <button id="btn-forward" class="nav-btn" title="Forward (Cmd+] / Alt+Right)" disabled>
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 3 11 8 6 13"></polyline>
        </svg>
      </button>
      <button id="btn-reload" class="nav-btn" title="Reload Tab (Cmd+R / Ctrl+R)">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9L14 6.5"/>
          <polyline points="14 2.5 14 6.5 10 6.5"/>
        </svg>
      </button>
    </div>

    <!-- Dynamic Tabs List -->
    <div id="tabs-list" class="tabs-list">
      <!-- Tabs rendered via TabBarController -->
    </div>

    <!-- New Tab Button -->
    <button id="btn-new-tab" class="new-tab-btn" title="New Tab (Cmd+T / Ctrl+T)">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="8" y1="3" x2="8" y2="13"></line>
        <line x1="3" y1="8" x2="13" y2="8"></line>
      </svg>
    </button>

    <!-- Empty draggable area to fill the rest of the tab bar -->
    <div class="drag-spacer"></div>

    <!-- Trailing Controls: Zoom & Theme -->
    <div class="trailing-controls">
      <!-- Zoom Control with Popover -->
      <div class="zoom-control-container" id="zoom-control-container">
        <button id="btn-zoom" class="nav-btn zoom-btn" title="Text Size & Zoom (100%)" aria-label="Text Size & Zoom" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 12.5L5.5 3.5L8.5 12.5"/>
            <path d="M3.7 9.5h4.1"/>
            <path d="M10 12.5L12.5 6.5L15 12.5"/>
            <path d="M10.8 10.5h3.4"/>
          </svg>
        </button>

        <!-- Compact Zoom Popover (− 100% +) -->
        <div id="zoom-popover" class="zoom-popover hidden" role="dialog" aria-label="Zoom Controls">
          <button id="btn-zoom-out" class="zoom-action-btn" title="Zoom Out (Ctrl+-)" aria-label="Zoom Out">−</button>
          <button id="btn-zoom-reset" class="zoom-reset-btn" title="Reset Zoom to 100% (Ctrl+0)" aria-label="Reset Zoom to 100%">100%</button>
          <button id="btn-zoom-in" class="zoom-action-btn" title="Zoom In (Ctrl+=)" aria-label="Zoom In">+</button>
        </div>
      </div>

      <!-- Theme Toggle -->
      <button id="btn-theme" class="nav-btn theme-btn" title="Appearance: Follow System / Dark / Light" aria-label="Toggle Theme">
        <svg id="icon-theme" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="4"></circle>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/>
        </svg>
      </button>
    </div>

    <!-- Windows titlebar overlay space reservation (138px for minimize/maximize/close) -->
    <div id="windows-controls-spacer" class="windows-controls-spacer"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
